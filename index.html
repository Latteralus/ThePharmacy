<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none';" />
    <title>The Pharmacy</title>
    <link rel="stylesheet" href="main/css/style.css" />
  </head>
  <body class="menu-page">
    <main class="menu">
      <header class="menu-header">
        <h1>The Pharmacy</h1>
        <p>Run a pharmacy, from a leased storefront to a company.</p>
      </header>

      <div id="main-menu" class="menu-buttons">
        <button type="button" class="btn btn-primary" id="newGameBtn">New Game</button>
        <button type="button" class="btn" id="loadGameBtn">Load Game</button>
        <button type="button" class="btn" id="settingsBtn">Settings</button>
        <button type="button" class="btn" id="exitBtn">Exit</button>
      </div>

      <!-- The new-game screen: menu/mainMenu.ts builds it -->
      <section id="new-game-panel" class="menu-panel" hidden>
        <h2>Start a new pharmacy</h2>
      </section>

      <section id="load-game-panel" class="menu-panel" hidden>
        <h2>Load a saved game</h2>
        <div class="card"><div class="card-body flush" id="save-list"></div></div>
        <div class="toolbar menu-actions">
          <button type="button" class="btn" id="load-game-back">Back</button>
        </div>
      </section>

      <div class="menu-version">Version 1.0.0</div>
    </main>

    <script src="build/main/components/kit.js"></script>
    <script src="build/main/js/data/properties.js"></script>
    <script src="build/main/js/data/lending.js"></script>
    <script src="build/main/menu/mainMenu.js"></script>
  </body>
</html>
